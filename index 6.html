<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weblingo — Learn digital & AI tools</title>

  <!-- Google Fonts: a mono-adjacent display face + a clean body face + a real mono face for "prompt" UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- App shell: one <main> element, JS swaps what's inside it between screens -->
  <div class="app-shell">

    <header class="topbar">
      <div class="logo">
        <strong>Weblingo</strong>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light theme">🌙</button>
        <div class="streak-badge" id="streak-badge" hidden>
          <span class="streak-flame">●</span> <span id="streak-count">0</span> day streak
        </div>
      </div>
    </header>

    <main id="app-root">
      <!-- Screens are injected here by app.js -->
    </main>

    <footer class="foot-note">Weblingo · a friendlier way into AI tools</footer>
  </div>

  <!-- TEMPORARY DEBUG HELPER: shows any JavaScript error directly on the
       page as a red banner. This is here purely to diagnose the blank-page
       issue — safe to delete once things are working again. -->
  <script>
    window.addEventListener("error", (e) => {
      const banner = document.createElement("div");
      banner.style.cssText =
        "background:#c0392b;color:white;padding:14px;font-family:monospace;" +
        "font-size:13px;white-space:pre-wrap;position:relative;z-index:9999;";
      banner.textContent = "JS ERROR: " + e.message + "\n" + e.filename + ":" + e.lineno;
      document.body.prepend(banner);
    });
  </script>

  <!-- Supabase client setup — connected to the real "Weblingo" project. -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://bwzvlpkwxzezgjqgylkk.supabase.co",
      "sb_publishable_F-Ds1777vdDIlAnU-TTv3g_-Hv2AyZL"
    );

    window.supabaseClient = supabase;

    // Quick connectivity check, logged to console.
    supabase.auth.getSession()
      .then(() => console.log("Supabase: connected OK"))
      .catch((err) => console.error("Supabase: connection failed —", err));
  </script>

  <script src="app.js"></script>
</body>
</html>
